  .prec button b { font-size: 10px; font-weight: 400; opacity: 0.75; margin-left: 7px; }
  .prec-repo { font-size: 10.5px; margin-top: 5px; opacity: 0.85; }
  .controls { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .tbtn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid; border-radius: 8px;
    padding: 6px 12px; font-family: ${T.mono}; font-size: 12px; letter-spacing: 0.5px; }
  .iconb { width: 34px; height: 34px; border-radius: 10px; border: 1px solid ${T.line}; background: #0B120Bdd;
    color: ${T.mut}; font-size: 15px; backdrop-filter: blur(8px); }
  .popover { background: #0D140Df2; border: 1px solid ${T.line}; border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 6px; box-shadow: 0 12px 40px #000000a0; backdrop-filter: blur(10px); }
  .pop-h { font-family: ${T.serif}; font-style: italic; font-size: 14px; color: #fff; margin-bottom: 2px; }
  .pop-b { font-size: 11.5px; color: ${T.mut}; line-height: 1.9; }
  .stats { bottom: 16px; left: 16px; display: flex; gap: 8px; flex-wrap: wrap; max-width: 62%; pointer-events: none; }
  .rail { width: 46px; background: #060906; border-right: 1px solid ${T.line}; display: flex;
    flex-direction: column; flex-shrink: 0; }
  .rail-cap { font-size: 9px; letter-spacing: 2px; color: ${T.faint}; text-align: center; padding: 8px 0; }
  .rail-row { border-radius: 2px; margin: 1px 0; cursor: pointer; min-height: 2px; transition: background 80ms linear; }
  .side { width: 396px; background: ${T.panel}; border-left: 1px solid ${T.line}; display: flex;
    flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .side-h { padding: 14px 18px 12px; border-bottom: 1px solid ${T.line}; display: flex;
    justify-content: space-between; align-items: center; gap: 10px; }
  .side-body { flex: 1; overflow-y: auto; padding: 0 18px 18px; }
  .side-f { border-top: 1px solid ${T.line}; padding: 10px 18px; }
  .eyebrow { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: ${C.accent}; margin-bottom: 3px; }
  .chip { font-family: ${T.mono}; font-style: normal; font-size: 10px; border: 1px solid; border-radius: 5px;
    padding: 1.5px 6px; margin-left: 8px; vertical-align: 2px; letter-spacing: 0.5px; }
  .navb { width: 30px; height: 30px; border-radius: 8px; border: 1px solid ${T.line}; background: #FFFFFF08;
    color: ${T.mut}; font-size: 13px; flex-shrink: 0; }
  .navb:hover { color: #fff; border-color: ${C.accent}66; }
  .wrow { display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-bottom: 1px solid #FFFFFF06; border-radius: 4px; }
  .wdot { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
  .wname { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wshape { display: flex; align-items: center; gap: 7px; font-size: 11px; color: ${T.mut}; font-weight: 600; }
  .wtag { font-style: normal; font-size: 9.5px; border: 1px solid; border-radius: 4px; padding: 0 4px; }
  .wp { display: block; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wb { display: block; font-size: 10.5px; color: ${T.faint}; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .legit { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: ${T.mut}; }
  .legit i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: ${T.panel}f5;
    border-top: 1px solid ${T.line}; border-radius: 18px 18px 0 0; backdrop-filter: blur(12px);
    box-shadow: 0 -12px 40px #000000a0; transition: max-height 260ms ease; max-height: 68px; overflow: hidden;
    display: flex; flex-direction: column; }
  .sheet.open { max-height: 62vh; }
  .sheet-h { padding: 6px 16px 12px; flex-shrink: 0; cursor: pointer; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: #FFFFFF26; margin: 6px auto 8px; }
  .sheet-body { overflow-y: auto; padding: 0 16px 22px; -webkit-overflow-scrolling: touch; }
  .side-body::-webkit-scrollbar, .sheet-body::-webkit-scrollbar { width: 8px; }
  .side-body::-webkit-scrollbar-thumb, .sheet-body::-webkit-scrollbar-thumb { background: #FFFFFF14; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .sheet { transition: none; } .tip { transition: none; }
  }
  @media (max-width: 480px) {
    .brand-word { font-size: 22px; }
    .prec button { padding: 7px 11px; font-size: 11.5px; }
    .prec button b { display: none; }
  }
`;
render(html`<${App} />`, document.getElementById("root"));
</script>
</body>
</html>
